<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <base target="_blank" />
    <title>Sidepanel</title>
    <style>
      /* 浏览器原生侧边栏标题栏删不掉，UI 自身必须铺满整栏：
         去掉 body 默认 margin 的"边框"，并把高度链打通到 #app */
      html,
      body,
      #app {
        margin: 0;
        padding: 0;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
